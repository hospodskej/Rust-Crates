[package]
name = "cuticle"
version = "0.1.0"
description = "Tower layer for Axum that sets strict security headers, including a Content-Security-Policy with a fresh nonce per request"
keywords = ["csp", "security", "headers", "axum", "tower"]
categories = ["web-programming::http-server", "network-programming"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum-core = { version = "0.5", optional = true }
base64 = "0.22"
getrandom = "0.3"
http = "1"
leptos = { version = "0.8.20", default-features = false, features = ["nonce"], optional = true }
pin-project-lite = "0.2"
tower-layer = "0.3"
tower-service = "0.3"

[features]
default = ["axum"]
# `FromRequestParts` extractor for `CspNonce`.
axum = ["dep:axum-core"]
# Hands the nonce to Leptos 0.8 SSR (needs Rust 1.88, the MSRV of leptos).
leptos = ["dep:leptos"]

[dev-dependencies]
axum = "0.8"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[package.metadata.docs.rs]
all-features = true
